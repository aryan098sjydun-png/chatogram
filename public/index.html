<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>چتوگرام</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f4f5fb;
      color: #202124;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    .hidden {
      display: none !important;
    }

    .app {
      width: 100%;
      max-width: 600px;
      min-height: 100vh;
      margin: auto;
      background: white;
      box-shadow: 0 0 30px rgba(0,0,0,.08);
    }

    header {
      background: linear-gradient(135deg, #6754f5, #4432b8);
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
      opacity: .9;
    }

    .content {
      padding: 20px;
    }

    .welcome {
      text-align: center;
      margin-bottom: 20px;
    }

    .welcome h2 {
      margin-bottom: 8px;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px;
      background: #f7f7fb;
      border-radius: 16px;
      margin-bottom: 20px;
    }

    .avatar {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      object-fit: cover;
      background: linear-gradient(135deg,#6b54f5,#282f4a);
      flex-shrink: 0;
    }

    .profile-info {
      flex: 1;
    }

    .profile-info b {
      display: block;
      font-size: 16px;
      margin-bottom: 5px;
    }

    .profile-info small {
      color: #777;
    }

    .section-title {
      font-weight: bold;
      margin: 20px 0 12px;
    }

    .find-buttons {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .findBtn {
      border: 0;
      padding: 17px;
      border-radius: 14px;
      background: #6754f5;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .findBtn:active {
      transform: scale(.98);
    }

    .findBtn.any {
      background: #222;
    }

    .online-box {
      margin-top: 20px;
      border: 1px solid #eee;
      border-radius: 16px;
      overflow: hidden;
    }

    .online-title {
      padding: 15px;
      background: #fafafa;
      font-weight: bold;
    }

    .onlineUser {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 15px;
      border-top: 1px solid #eee;
    }

    .onlineUser .avatar {
      width: 42px;
      height: 42px;
    }

    .onlineUser b {
      display: block;
    }

    .onlineUser small {
      color: #777;
    }

    /* CHAT */

    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px;
      border-bottom: 1px solid #eee;
    }

    .chat-header-info {
      flex: 1;
    }

    .chat-header-info b {
      display: block;
    }

    .chat-header-info small {
      color: #777;
    }

    .chat-actions button {
      border: 0;
      background: #f1f1f5;
      padding: 9px 12px;
      border-radius: 10px;
      cursor: pointer;
    }

    .searching {
      text-align: center;
      padding: 70px 20px;
    }

    .loader {
      width: 45px;
      height: 45px;
      border: 4px solid #eee;
      border-top-color: #6754f5;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .messages {
      height: calc(100vh - 260px);
      min-height: 350px;
      overflow-y: auto;
      padding: 15px;
      background: #f7f7fb;
    }

    .msg {
      background: white;
      border-radius: 14px;
      padding: 10px 13px;
      margin-bottom: 10px;
      width: fit-content;
      max-width: 85%;
      box-shadow: 0 2px 7px rgba(0,0,0,.05);
      word-break: break-word;
    }

    .msg.me {
      margin-right: auto;
      background: #6754f5;
      color: white;
    }

    .msg time {
      display: block;
      font-size: 10px;
      opacity: .6;
      margin-top: 5px;
    }

    #messageForm {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #eee;
      background: white;
    }

    #messageInput {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 12px;
      outline: none;
      font-size: 15px;
    }

    #messageForm button {
      width: 55px;
      border: 0;
      border-radius: 12px;
      background: #6754f5;
      color: white;
      font-size: 20px;
    }

    .bottom-buttons {
      display: flex;
      gap: 8px;
      padding: 10px;
    }

    .bottom-buttons button {
      flex: 1;
      border: 0;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
    }

    #nextBtn {
      background: #6754f5;
      color: white;
    }

    #reportBtn {
      background: #eee;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 25px;
      transform: translateX(-50%);
      background: #222;
      color: white;
      padding: 13px 18px;
      border-radius: 12px;
      display: none;
      z-index: 1000;
      max-width: 90%;
      text-align: center;
    }

    @media (max-width: 600px) {
      .app {
        min-height: 100vh;
        box-shadow: none;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>💬 چتوگرام</h1>
    <p>گفت‌وگوی ناشناس با افراد آنلاین</p>
  </header>

  <!-- HOME -->
  <section id="homePage" class="content">

    <div class="welcome">
      <h2>خوش آمدی 👋</h2>
      <p>بدون ثبت‌نام با افراد جدید چت کن.</p>
    </div>

    <div class="profile">
      <img id="myPhoto" class="avatar" alt="کاربر">
      <div class="profile-info">
        <b id="myName">کاربر مهمان</b>
        <small id="myMeta">در حال اتصال...</small>
      </div>
    </div>

    <div class="section-title">
      با چه کسی می‌خواهی صحبت کنی؟
    </div>

    <div class="find-buttons">
      <button class="findBtn" data-gender="male">
        👨 چت با آقا
      </button>

      <button class="findBtn" data-gender="female">
        👩 چت با خانم
      </button>

      <button class="findBtn any" data-gender="any">
        🎲 چت تصادفی
      </button>
    </div>

    <div class="online-box">
      <div class="online-title">
        🟢 کاربران آنلاین: <span id="onlineCount">0</span>
      </div>

      <div id="onlineList"></div>
    </div>

  </section>

  <!-- CHAT -->
  <section id="chatPage" class="hidden">

    <div class="chat-header">

      <img id="partnerPhoto" class="avatar" alt="کاربر">

      <div class="chat-header-info">
        <b id="partnerName">در حال جستجو...</b>
        <small id="partnerMeta">منتظر اتصال</small>
      </div>

    </div>

    <div id="searching" class="searching">

      <div class="loader"></div>

      <h3>در حال پیدا کردن فرد مناسب...</h3>

      <p>
        لطفاً چند لحظه صبر کن
      </p>

      <button id="cancelSearch">
        انصراف
      </button>

    </div>

    <div id="messages" class="messages"></div>

    <form id="messageForm" class="hidden">

      <input
        id="messageInput"
        type="text"
        maxlength="2000"
        placeholder="پیامت را بنویس..."
        autocomplete="off"
      >

      <button type="submit">
        ➤
      </button>

    </form>

    <div class="bottom-buttons">

      <button id="nextBtn">
        ⏭ نفر بعد
      </button>

      <button id="reportBtn">
        🚩 گزارش
      </button>

    </div>

  </section>

</div>

<div id="toast" class="toast"></div>

<!-- Socket.IO -->
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<!-- فایل اصلی برنامه -->
<script src="app.js"></script>

</body>
</html>
