<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>هوشینو | دستیار هوش مصنوعی</title>

  <meta name="description"
        content="هوشینو، دستیار هوش مصنوعی همه‌کاره برای گفتگو، تولید محتوا، کدنویسی، تصویر و تحلیل فایل.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

  <style>

    /* =====================================================
       ROOT
    ===================================================== */

    :root {
      --bg: #08090d;
      --bg-2: #0d0f15;
      --panel: #11131a;
      --panel-2: #151821;
      --panel-hover: #1a1d27;

      --border: rgba(255,255,255,.08);
      --border-hover: rgba(255,255,255,.14);

      --text: #f5f7fb;
      --muted: #8b91a1;
      --muted-2: #646b7b;

      --primary: #7657ff;
      --primary-2: #9a83ff;
      --cyan: #35d9ff;

      --green: #48e39a;
      --red: #ff5f6d;
      --yellow: #ffca5c;

      --sidebar: 260px;

      --radius: 16px;
      --radius-lg: 22px;

      --shadow:
        0 20px 70px rgba(0,0,0,.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Vazirmatn", sans-serif;
      background:
        radial-gradient(
          circle at 80% 0%,
          rgba(118,87,255,.12),
          transparent 30%
        ),
        radial-gradient(
          circle at 20% 100%,
          rgba(53,217,255,.07),
          transparent 30%
        ),
        var(--bg);

      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    button,
    input,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    ::selection {
      background: rgba(118,87,255,.4);
    }

    /* =====================================================
       SIDEBAR
    ===================================================== */

    .sidebar {
      position: fixed;
      right: 0;
      top: 0;
      bottom: 0;

      width: var(--sidebar);

      background:
        linear-gradient(
          180deg,
          rgba(18,20,28,.98),
          rgba(9,10,14,.98)
        );

      border-left: 1px solid var(--border);

      display: flex;
      flex-direction: column;

      z-index: 100;

      transition: .3s ease;
    }

    .brand {
      height: 80px;

      display: flex;
      align-items: center;

      padding: 0 22px;

      border-bottom: 1px solid var(--border);
    }

    .brand-logo {
      width: 40px;
      height: 40px;

      display: grid;
      place-items: center;

      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--cyan)
        );

      box-shadow:
        0 8px 30px rgba(118,87,255,.3);

      font-size: 20px;
      font-weight: 800;
    }

    .brand-text {
      margin-right: 11px;
    }

    .brand-name {
      font-size: 17px;
      font-weight: 800;
    }

    .brand-sub {
      color: var(--muted);
      font-size: 10px;
      margin-top: 2px;
    }

    .new-chat {
      margin: 18px;

      height: 45px;

      border: 0;
      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          #6241df
        );

      color: white;

      font-size: 13px;
      font-weight: 700;

      box-shadow:
        0 12px 30px rgba(118,87,255,.2);

      transition: .2s;
    }

    .new-chat:hover {
      transform: translateY(-1px);
      box-shadow:
        0 15px 35px rgba(118,87,255,.35);
    }

    .nav {
      padding: 0 11px;
      flex: 1;
    }

    .nav-title {
      color: var(--muted-2);
      font-size: 10px;
      margin: 8px 12px;
    }

    .nav-item {
      width: 100%;

      border: 0;
      background: transparent;

      color: var(--muted);

      display: flex;
      align-items: center;

      gap: 12px;

      padding: 11px 13px;

      border-radius: 11px;

      margin-bottom: 3px;

      text-align: right;

      font-size: 13px;

      transition: .2s;
    }

    .nav-item:hover {
      background: rgba(255,255,255,.04);
      color: white;
    }

    .nav-item.active {
      background:
        linear-gradient(
          90deg,
          rgba(118,87,255,.16),
          rgba(118,87,255,.04)
        );

      color: white;
    }

    .nav-icon {
      width: 21px;
      text-align: center;
      font-size: 17px;
    }

    .nav-badge {
      margin-right: auto;

      font-size: 9px;

      padding: 3px 7px;

      border-radius: 999px;

      background: rgba(72,227,154,.12);
      color: var(--green);
    }

    .sidebar-bottom {
      border-top: 1px solid var(--border);
      padding: 14px;
    }

    .user-card {
      display: flex;
      align-items: center;
      gap: 10px;

      padding: 9px;

      border-radius: 13px;

      transition: .2s;
    }

    .user-card:hover {
      background: rgba(255,255,255,.04);
    }

    .avatar {
      width: 36px;
      height: 36px;

      display: grid;
      place-items: center;

      border-radius: 11px;

      background:
        linear-gradient(
          135deg,
          #7657ff,
          #36d9ff
        );

      font-weight: 800;
      font-size: 12px;
    }

    .user-info {
      overflow: hidden;
    }

    .user-name {
      font-size: 12px;
      font-weight: 700;
    }

    .user-plan {
      color: var(--muted);
      font-size: 9px;
      margin-top: 2px;
    }

    /* =====================================================
       MAIN
    ===================================================== */

    .main {
      margin-right: var(--sidebar);
      min-height: 100vh;
    }

    /* =====================================================
       TOPBAR
    ===================================================== */

    .topbar {
      height: 80px;

      display: flex;
      align-items: center;

      justify-content: space-between;

      padding: 0 34px;

      border-bottom: 1px solid var(--border);

      background: rgba(8,9,13,.72);

      backdrop-filter: blur(20px);

      position: sticky;
      top: 0;

      z-index: 50;
    }

    .mobile-menu {
      display: none;

      border: 0;
      background: transparent;

      color: white;

      font-size: 22px;
    }

    .page-title h1 {
      font-size: 20px;
      font-weight: 700;
    }

    .page-title p {
      color: var(--muted);
      font-size: 11px;
      margin-top: 4px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      width: 39px;
      height: 39px;

      display: grid;
      place-items: center;

      border-radius: 11px;

      border: 1px solid var(--border);

      background: rgba(255,255,255,.025);

      color: var(--muted);

      font-size: 16px;

      transition: .2s;
    }

    .icon-btn:hover {
      color: white;
      background: rgba(255,255,255,.06);
      border-color: var(--border-hover);
    }

    /* =====================================================
       CONTENT
    ===================================================== */

    .content {
      max-width: 1500px;
      margin: auto;

      padding: 32px;
    }

    /* =====================================================
       HERO
    ===================================================== */

    .hero {
      position: relative;

      overflow: hidden;

      padding: 34px;

      border-radius: var(--radius-lg);

      border: 1px solid var(--border);

      background:
        radial-gradient(
          circle at 80% 30%,
          rgba(118,87,255,.18),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          rgba(255,255,255,.035),
          rgba(255,255,255,.01)
        );

      box-shadow: var(--shadow);
    }

    .hero:after {
      content: "";

      position: absolute;

      width: 250px;
      height: 250px;

      left: -100px;
      bottom: -150px;

      border-radius: 50%;

      background: rgba(53,217,255,.08);

      filter: blur(20px);
    }

    .hero-label {
      display: inline-flex;

      align-items: center;
      gap: 7px;

      padding: 6px 11px;

      border-radius: 999px;

      background: rgba(72,227,154,.08);

      border: 1px solid rgba(72,227,154,.13);

      color: var(--green);

      font-size: 10px;

      margin-bottom: 16px;
    }

    .online-dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: var(--green);

      box-shadow:
        0 0 12px var(--green);
    }

    .hero h2 {
      font-size: clamp(27px,4vw,42px);

      line-height: 1.35;

      max-width: 700px;

      letter-spacing: -.7px;
    }

    .gradient-text {
      background:
        linear-gradient(
          90deg,
          #fff,
          #a48fff,
          #54e2ff
        );

      -webkit-background-clip: text;
      color: transparent;
    }

    .hero p {
      max-width: 650px;

      color: var(--muted);

      font-size: 13px;

      line-height: 2;

      margin-top: 10px;
    }

    /* =====================================================
       STATS
    ===================================================== */

    .stats {
      display: grid;

      grid-template-columns:
        repeat(4,1fr);

      gap: 13px;

      margin-top: 18px;
    }

    .stat {
      padding: 18px;

      background: var(--panel);

      border: 1px solid var(--border);

      border-radius: var(--radius);

      transition: .2s;
    }

    .stat:hover {
      background: var(--panel-hover);
      border-color: var(--border-hover);
    }

    .stat-top {
      display: flex;

      justify-content: space-between;

      color: var(--muted);

      font-size: 11px;
    }

    .stat-icon {
      width: 30px;
      height: 30px;

      display: grid;
      place-items: center;

      border-radius: 9px;

      background: rgba(118,87,255,.1);

      color: var(--primary-2);
    }

    .stat-number {
      font-size: 25px;

      font-weight: 800;

      margin-top: 13px;
    }

    .stat-change {
      font-size: 9px;

      margin-top: 5px;

      color: var(--green);
    }

    /* =====================================================
       SECTION
    ===================================================== */

    .section {
      margin-top: 30px;
    }

    .section-header {
      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-bottom: 14px;
    }

    .section-title {
      font-size: 17px;
      font-weight: 700;
    }

    .section-description {
      color: var(--muted);

      font-size: 10px;

      margin-top: 4px;
    }

    .see-all {
      border: 0;

      background: transparent;

      color: var(--primary-2);

      font-size: 11px;
    }

    /* =====================================================
       TOOLS
    ===================================================== */

    .tools {
      display: grid;

      grid-template-columns:
        repeat(4,1fr);

      gap: 12px;
    }

    .tool {
      padding: 18px;

      border-radius: var(--radius);

      border: 1px solid var(--border);

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.035),
          rgba(255,255,255,.012)
        );

      cursor: pointer;

      transition:
        transform .2s,
        background .2s,
        border .2s;
    }

    .tool:hover {
      transform: translateY(-3px);

      background: var(--panel-hover);

      border-color:
        rgba(118,87,255,.35);
    }

    .tool-icon {
      width: 43px;
      height: 43px;

      display: grid;
      place-items: center;

      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          rgba(118,87,255,.15),
          rgba(53,217,255,.08)
        );

      font-size: 20px;

      margin-bottom: 14px;
    }

    .tool h3 {
      font-size: 13px;
      margin-bottom: 6px;
    }

    .tool p {
      color: var(--muted);

      font-size: 10px;

      line-height: 1.9;
    }

    /* =====================================================
       CHAT
    ===================================================== */

    .workspace {
      display: grid;

      grid-template-columns:
        minmax(0,1fr)
        300px;

      gap: 14px;

      margin-top: 30px;
    }

    .chat {
      min-height: 570px;

      background: var(--panel);

      border: 1px solid var(--border);

      border-radius: var(--radius-lg);

      overflow: hidden;

      display: flex;
      flex-direction: column;
    }

    .chat-header {
      min-height: 67px;

      padding: 13px 18px;

      border-bottom: 1px solid var(--border);

      display: flex;

      align-items: center;

      justify-content: space-between;
    }

    .model {
      display: flex;

      align-items: center;

      gap: 10px;
    }

    .model-icon {
      width: 37px;
      height: 37px;

      display: grid;
      place-items: center;

      border-radius: 11px;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--cyan)
        );

      font-size: 17px;
    }

    .model-name {
      font-size: 12px;
      font-weight: 700;
    }

    .model-status {
      color: var(--green);
      font-size: 9px;
      margin-top: 2px;
    }

    .model-select {
      background: rgba(255,255,255,.04);

      color: var(--muted);

      border: 1px solid var(--border);

      border-radius: 9px;

      padding: 7px 9px;

      outline: none;

      font-family: inherit;

      font-size: 10px;
    }

    .messages {
      flex: 1;

      min-height: 400px;

      max-height: 510px;

      overflow-y: auto;

      padding: 24px;
    }

    .message {
      display: flex;

      gap: 10px;

      margin-bottom: 22px;

      animation: fadeIn .25s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .message-avatar {
      flex: 0 0 32px;

      width: 32px;
      height: 32px;

      display: grid;
      place-items: center;

      border-radius: 10px;

      background: rgba(255,255,255,.06);

      font-size: 13px;
    }

    .message.user .message-avatar {
      background:
        linear-gradient(
          135deg,
          var(--primary),
          #573ad4
        );
    }

    .message-content {
      max-width: 75%;
    }

    .message-name {
      color: var(--muted);

      font-size: 9px;

      margin-bottom: 5px;
    }

    .bubble {
      padding: 12px 15px;

      border-radius: 14px;

      background: rgba(255,255,255,.035);

      border: 1px solid var(--border);

      font-size: 12px;

      line-height: 2;
    }

    .message.user .bubble {
      background:
        linear-gradient(
          135deg,
          rgba(118,87,255,.85),
          rgba(86,61,202,.85)
        );

      border-color: transparent;
    }

    .chat-input-area {
      padding: 14px;

      border-top: 1px solid var(--border);
    }

    .input-box {
      display: flex;

      align-items: flex-end;

      gap: 9px;

      padding: 8px;

      border-radius: 15px;

      border: 1px solid var(--border);

      background: rgba(255,255,255,.025);
    }

    .input-box:focus-within {
      border-color:
        rgba(118,87,255,.5);

      box-shadow:
        0 0 0 3px rgba(118,87,255,.06);
    }

    #messageInput {
      flex: 1;

      resize: none;

      min-height: 40px;
      max-height: 130px;

      border: 0;

      outline: 0;

      background: transparent;

      color: white;

      padding: 8px;

      font-size: 12px;

      line-height: 1.8;
    }

    #messageInput::placeholder {
      color: var(--muted-2);
    }

    .input-actions {
      display: flex;
      gap: 5px;
    }

    .input-btn {
      width: 36px;
      height: 36px;

      display: grid;
      place-items: center;

      border: 0;

      border-radius: 10px;

      background: transparent;

      color: var(--muted);

      font-size: 15px;
    }

    .input-btn:hover {
      color: white;

      background: rgba(255,255,255,.06);
    }

    .send-btn {
      width: 39px;
      height: 39px;

      border: 0;

      border-radius: 11px;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          #5d40d7
        );

      color: white;

      font-size: 15px;

      box-shadow:
        0 8px 20px rgba(118,87,255,.25);
    }

    .input-hint {
      text-align: center;

      color: var(--muted-2);

      font-size: 8px;

      margin-top: 8px;
    }

    /* =====================================================
       RIGHT PANEL
    ===================================================== */

    .side-panel {
      display: flex;

      flex-direction: column;

      gap: 14px;
    }

    .panel {
      background: var(--panel);

      border: 1px solid var(--border);

      border-radius: var(--radius-lg);

      padding: 18px;
    }

    .panel-title {
      font-size: 13px;
      font-weight: 700;

      margin-bottom: 15px;
    }

    .quick {
      display: flex;

      align-items: center;

      gap: 10px;

      padding: 10px;

      border-radius: 11px;

      cursor: pointer;

      transition: .2s;
    }

    .quick:hover {
      background: rgba(255,255,255,.045);
    }

    .quick-icon {
      width: 34px;
      height: 34px;

      display: grid;
      place-items: center;

      border-radius: 10px;

      background: rgba(118,87,255,.1);
    }

    .quick-text strong {
      display: block;

      font-size: 10px;
    }

    .quick-text span {
      color: var(--muted);

      display: block;

      font-size: 8px;

      margin-top: 2px;
    }

    /* =====================================================
       USAGE
    ===================================================== */

    .usage-head {
      display: flex;

      justify-content: space-between;

      font-size: 10px;

      color: var(--muted);

      margin-bottom: 10px;
    }

    .usage-head strong {
      color: white;
    }

    .progress {
      height: 7px;

      background: rgba(255,255,255,.06);

      border-radius: 999px;

      overflow: hidden;
    }

    .progress-bar {
      height: 100%;

      width: 68%;

      background:
        linear-gradient(
          90deg,
          var(--primary),
          var(--cyan)
        );

      border-radius: inherit;
    }

    .usage-info {
      color: var(--muted);

      font-size: 8px;

      margin-top: 8px;

      line-height: 1.8;
    }

    .upgrade {
      width: 100%;

      margin-top: 12px;

      border: 0;

      border-radius: 10px;

      padding: 9px;

      color: white;

      background:
        linear-gradient(
          135deg,
          rgba(118,87,255,.25),
          rgba(53,217,255,.12)
        );

      font-size: 10px;
    }

    /* =====================================================
       MOBILE
    ===================================================== */

    .overlay {
      display: none;

      position: fixed;

      inset: 0;

      background: rgba(0,0,0,.6);

      z-index: 90;
    }

    @media(max-width:1100px) {

      .tools {
        grid-template-columns:
          repeat(2,1fr);
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      .side-panel {
        display: grid;

        grid-template-columns:
          repeat(2,1fr);
      }
    }

    @media(max-width:800px) {

      :root {
        --sidebar: 250px;
      }

      .sidebar {
        transform: translateX(100%);
      }

      .si
